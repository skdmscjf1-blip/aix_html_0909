<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li{font-size: 30px; color: yellow;}    /* 태그 : 해당되는 태그 모두지정 */
        #f1{color: red;}    /* 아이디 : 1개만 지정 */
        .v{color: greenyellow;} /* 클래스 : 여러개를 지정 , 우선순위 id -> 클래스 -> 태그 */ 



    </style>
</head>
<body>
    <ul>
        <li id="f1">사과</li>
        <li class="v">오이</li>
        <li>배</li>
        <li class="v">상추</li>
        <li>수박</li>
        <li class="v">감자</li>
    </ul>


</body>
</html>
