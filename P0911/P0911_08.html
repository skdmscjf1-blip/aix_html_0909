<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{border: 20px dotted black;
            width: 300px; height: 200px;
            background: greenyellow;
            padding: 30px;
        }
        #d01{background-clip: border-box ;}
        #d02{background-clip: padding-box ;}
        #d03{background-clip: content-box ;}
    </style>
</head>
<body>
    <div id="d01">1111</div>
    <div id="d02">1111</div>
    <div id="d03">1111</div>

</body>
</html>
