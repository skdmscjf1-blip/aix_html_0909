<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>나이입력</label>
    <input type="text" name="age" id="age"><br>
    <button type="button" onclick="btn()">확인</button>
    <script>
        function btn(){
            let age = Number(document.getElementById("age").value)
            if(age>=18){
                alert("18세이상 성인입니다.")


            }else{
                alert("18세미만 미성년자입니다.")

            }

        }


    </script>
</body>
</html>
