<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script  src="http://code.jquery.com/jquery-latest.min.js"></script>
    <title>Document</title>
    <style>
        h2{text-align: center;}
        table,th,td{border:1px solid black; border-collapse: collapse; }
        table{width:1000px; text-align: center; box-sizing: border-box;
        margin:50px auto;}
        th{background: #efefef; height:60px;}
        td{height:40px;}
    </style>
    <script>
        //제이쿼리 선언
        $(function(){
            
        })//제이쿼리
        function saveBtn(){
            //alert("test")
            var no = $("#no").val();
            var name = $("#name").val();
            var kor = Number($("#kor").val());
            var eng = Number($("#eng").val());
            var math = Number($("#math").val());
            var total = kor + eng + math;
            var avg = total /3 ;
            console.log(no,name,kor,eng,math,total,avg)

        }

    </script>
</head>
<body>
    <h2>학생성적프로그램</h2>
    <input type="text" name="no" id="no" placeholder="번호입력"><br>
    <input type="text" name="name" id="name" placeholder="이름입력"><br>
    <input type="text" name="kor" id="kor" placeholder="국어점수입력"><br>
    <input type="text" name="eng" id="eng" placeholder="영어점수입력"><br>
    <input type="text" name="math" id="math" placeholder="수학점수입력"><br>
    <button type="button" onclick="saveBtn()">저장</button>
    <table>
        <colgroup>
            <col width="10%">
            <col width="15%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="15%">
        </colgroup>
        <thead>
            <tr>
                <th>번호</th>
                <th>이름</th>
                <th>국어</th>
                <th>영어</th>
                <th>수학</th>
                <th>합계</th>
                <th>평균</th>
                <th>등수</th>
                <th>버튼</th>
            </tr>
        </thead>
        <tbody id="tbody">

        </tbody>
    </table>

    <script>
        //반복문 사용 : 10번
        var a = ``;
        for(var i=1;i<=1;i++){
            a += `<tr>
                <td>${i}</td>
                <td>홍길동</td>
                <td>100</td>
                <td>100</td>
                <td>100</td>
                <td>300</td>
                <td>100.0</td>
                <td>0</td>
                <td>
                    <button>수정</button>
                    <button>삭제</button>
                    </td>
                </tr>`;
        }

        document.getElementById("tbody").innerHTML=a;
    </script>
</body>
</html>
