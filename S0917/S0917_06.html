<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{text-align: center;}
        table,th,td{border: 1px solid black; border-collapse: collapse ;}
        table{width: 1000px; text-align: center; box-sizing: border-box;
        margin: 50px auto;}
        th{background: #efefef; height: 60px;}
        td{height: 40px;}

    </style>
</head>
<body>
    <h2>학생성적프로그램</h2>
    <table>
        <colgroup>
            <col width="10%">
            <col width="20%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="15%">
            <col width="15%">
            <col width="10%">
        </colgroup>
        <thead>    
            <tr>
                <th>번호</th>
                <th>이름</th>
                <th>국어</th>
                <th>영어</th>
                <th>수학</th>
                <th>합계</th>
                <th>평균</th>
                <th>등수</th>
            </tr>
        </thead>
        <tbody id="tbody">



            
        </tbody>
            
    </table>

    <script>
        //반복문 사용 : 10번

        var aaa=``;

        for(var i=1;i<=10;i++)
            aaa +=`
            <tr>
                <td>${i}</td>
                <td>홍길동</td>
                <td>100</td>
                <td>100</td>
                <td>100</td>
                <td>300</td>
                <td>100.0</td>
                <td>0</td>
            </tr>        
            `;
        document.getElementById("tbody").innerHTML= aaa;

        */

    </script>
</body>
</html>
