<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,th,td{border: 1px solid black;}
        table{border-collapse: collapse;} /* 선두께 없애기*/
        td{width: 100px; height: 40px;}


    </style>
</head>
<body>
    <table>
        <tr>
            <th>번호</th>
            <th>이름</th>
            <th>합계</th>
        </tr>

        <tr>
            <td>1</td>
            <td>홍길동</td>
            <td>100</td>

        </tr>

        
    </table>
    <br>
    <table>
        <tr>
            <td>1행1열</td>
            <td>1행2열</td>
            <td>1행3열</td>
            <td>1행4열</td>
        </tr>

        <tr>
            <td rowspan="2">2행1열</td>
            <td colspan="3">2행2열</td>

        </tr>

        <tr>
            <td>3행2열</td>
            <td>3행3열</td>
            <td>3행4열</td>
        </tr>

        </table>
</body>
</html>
