<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>게시글 작성</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                "Noto Sans KR",
                sans-serif;

            color: #111;
        }


        /* 전체 */

        .container {
            width: calc(100% - 120px);
            max-width: 1100px;

            margin: 25px 0 80px 63px;
        }


        /* 제목 */

        h1 {
            font-size: 32px;

            margin: 0 0 28px;
        }


        /* 입력 영역 */

        .field {
            margin-bottom: 28px;
        }


        label {
            display: block;

            font-size: 19px;

            margin-bottom: 11px;
        }


        /* input */

        input {
            width: 100%;
            height: 38px;

            border: 2px solid #e1e1e1;

            border-radius: 6px;

            padding: 0 15px;

            font-size: 17px;

            outline: none;
        }


        input:focus {
            border-color: #536bea;
        }


        input::placeholder {
            color: #888;
        }


        /* textarea */

        textarea {
            width: 100%;
            height: 197px;

            border: 2px solid #e1e1e1;

            border-radius: 6px;

            padding: 8px 15px;

            font-family: inherit;

            font-size: 17px;

            resize: vertical;

            outline: none;
        }


        textarea:focus {
            border-color: #536bea;
        }


        textarea::placeholder {
            color: #888;
        }


        /* 버튼 */

        .buttons {
            margin-top: 25px;
        }


        .btn {
            display: inline-block;

            border: none;

            border-radius: 6px;

            background: #536bea;

            color: white;

            padding: 7px 17px;

            font-size: 16px;

            cursor: pointer;

            text-decoration: none;

            margin-right: 3px;
        }


        .btn:hover {
            background: #4058d5;
        }


        /* 파일 */

        .file-input {
            padding: 6px;
            height: auto;
        }


    </style>

</head>


<body>


<div class="container">


    <h1>
        게시글 작성
    </h1>


    <form
        onsubmit="registerPost(event)"
    >


        <!-- 제목 -->

        <div class="field">

            <label for="title">
                제목
            </label>


            <input
                type="text"
                id="title"
                placeholder="제목을 입력해 주세요"
                required
            >

        </div>



        <!-- 작성자 -->

        <div class="field">

            <label for="writer">
                작성자
            </label>


            <input
                type="text"
                id="writer"
                placeholder="이름을 입력해 주세요"
                required
            >

        </div>



        <!-- TAG -->

        <div class="field">

            <label for="tag">
                TAG
            </label>


            <input
                type="text"
                id="tag"
                placeholder="태그를 입력해 주세요"
            >

        </div>



        <!-- 내용 -->

        <div class="field">

            <label for="content">
                내용
            </label>


            <textarea
                id="content"
                placeholder="내용을 입력해 주세요"
                required
            ></textarea>

        </div>



        <!-- 첨부파일 -->

        <div class="field">

            <label for="file">
                첨부파일
            </label>


            <input
                type="file"
                id="file"
                class="file-input"
            >

        </div>



        <!-- 버튼 -->

        <div class="buttons">


            <button
                type="submit"
                class="btn"
            >
                등록
            </button>


            <a
                href="news_list.html"
                class="btn"
            >
                목록
            </a>


        </div>


    </form>


</div>



<script>


    function registerPost(event) {


        /* form이 새로고침되는 것 막기 */

        event.preventDefault();



        /* 입력값 가져오기 */

        let title =
            document
                .getElementById("title")
                .value;


        let writer =
            document
                .getElementById("writer")
                .value;


        let tag =
            document
                .getElementById("tag")
                .value;


        let content =
            document
                .getElementById("content")
                .value;



        /* 콘솔 확인 */

        console.log(
            "제목 :",
            title
        );


        console.log(
            "작성자 :",
            writer
        );


        console.log(
            "TAG :",
            tag
        );


        console.log(
            "내용 :",
            content
        );



        /* 등록 알림 */

        alert(
            "게시글이 등록되었습니다."
        );



        /* 목록페이지 이동 */

        location.href =
            "news_list.html";

    }


</script>


</body>

</html>
