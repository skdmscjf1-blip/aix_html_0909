<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=East+Sea+Dokdo&family=Gowun+Batang&display=swap');
        *{margin: 0;padding: 0;}
        #top {width: 100%; height: 35px; background: #202020;}
        #nav {width: 100%; height: 82px;border-bottom: 1px solid #202020;}
        #banner{ color: white;
            width: 100%; height: 640px;
            background: url(images/main_top.jpg) no-repeat;
            box-sizing: border-box;
        }
        #b_txt{padding-left: 200px; padding-top: 200px;}
        #b_txt>p{font-size: 40px; border-bottom: 2px solid white;
                width: 230px;margin-bottom: 15px;
                font-family: "East Sea Dokdo", sans-serif;
                font-weight: 400;
                font-style: normal;
                color: #FC7EC6;
        }
        h2{font-size: 80px; margin-bottom: 5px;
            font-family: "Black Han Sans", sans-serif;
            font-weight: 400;font-style: normal;color: #E9C3E6;
            text-decoration: underline;
            text-shadow: 1px 1px 100px #000;
        }
        h3{font-size: 52px;
            font-family: "Gowun Batang", serif;
            font-weight: 400;
            font-style: normal;color: #A59837;
        }
        h4{line-height: 20px;}
    </style>
</head>
<body>

    <div id="top"></div>
    <div id="nav"></div>
    <div id="banner">
        <div id="b_txt">
            <p> 9/11 신메뉴 출시 </p>
            <h2>따끈한 소울푸드</h2>

            <h4>호르무즈 이어 홍해까지 장악되나···후티,<br>
                홍해 연안의 주요 도시 모카 접수</h4>
        </div>
    </div>

</body>
</html>
