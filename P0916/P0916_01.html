<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    div{width: 300px; height: 300px; color: blue;}
    img{width: 300px; 
    /* transition: all 1s; */
        transition-property: height;
        transition-duration: 1s;
    }

    .div:hover{height: 400px;}

    /* perspective : 입체감, 낮을수록 입체감이 큼
    transform-origin: 변형의 기준점 지정
    .c1:hover{transform: skewX(45deg); transform-origin:left top ;}
    .c2:hover{transform: rotateY(180deg);}
    .c3:hover{transform: perspective(100px) rotateY(180deg) ;}

    skew : 기울기
    .c1:hover{transform: skewX(45deg);}
    .c2:hover{transform: skewY(45deg);}
    .c3:hover{transform: skew(45deg,20deg);}

    rotate : 회전
    .c1:hover{transform: rotateX(45deg);}
    .c2:hover{transform: rotateY(45deg);}
    .c3:hover{transform: rotate(45deg);}



    scale : 확대
    .c1:hover{transform: scaleX(1.5);}
    .c2:hover{transform: scaleY(1.5);}
    .c3:hover{transform: scale(1.5);}

    translate : 이동 
    .c1:hover{transform: translateX(100px);}
    .c2:hover{transform: translateY(50px);}
    .c3:hover{transform: translate(50px,50px);}
     */
</style>

</head>
<body>
    <div></div>

</body>
</html>
