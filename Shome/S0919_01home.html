<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script  src="http://code.jquery.com/jquery-latest.min.js"></script>
    <title>Document</title>
    <style>
        h2{text-align: center; background: #efefef;}
        table,th,td{border: 1px solid black; border-collapse: collapse;}
        table{width: 1000px; text-align: center; box-sizing: border-box;
        margin: 50px auto;}
        th{background: #efefef;}
        td{height: 40px;}


    </style>

    <script>
        var students = [
            {"no":1,"name":"홍길동","kor":100,"eng":100,"math":100,"total":300,"avg":100.0,"rank":0},
            {"no":2,"name":"유관순","kor":100,"eng":100,"math":100,"total":300,"avg":100.0,"rank":0}
            ];
        
    $(function(){
        $("#math").on("keydown",function(e){
            if(e.key ==="Enter"){
                saveBtn();
            }
    });
        $("input").on("focus",function(){
            $(this).css({"background" :"yellow" });
    });
        $("input").on("blur",function(){
            $(this).css({"background" :"" });
    });
        $(document).on("click",".delete",function(){
            //alert("test")
            if(confirm("학생성적을 삭제하시겠습니까?")){
                var delno = $(this).closest("tr").attr("id");
                $("#"+delno).remove();

            }


    });

    });
    
        function saveBtn(){
            //alert("test")
            var no = $("#no").val();
            var name = $("#name").val();
            var kor = Number($("#kor").val());
            var eng = Number($("#eng").val());
            var math = Number($("#math").val());
            var total = kor+eng+math;
            var avg = total / 3;
            var bbb = `
                <tr id="${no}">
                    <td>${no}</td>
                    <td>${name}</td>
                    <td>${kor}</td>
                    <td>${eng}</td>
                    <td>${math}</td>
                    <td>${total}</td>
                    <td>${avg}</td>
                    <td>0</td>
                    <td>
                        <button class="update">수정</button>
                        <button class="delete">삭제</button>
                    </td>
                </tr>
            `;
            $("#tbody").append(bbb);
            alert("성적을 저장합니다.")
            $("#no").val("");
            $("#name").val("");
            $("#kor").val("");
            $("#eng").val("");
            $("#math").val("");
            $("#no").focus();
            console.log(no,name,kor,eng,math,total,avg);
    };

    </script>
</head>
<body>
    <h2>학생성적프로그램</h2>
    <input type="text" name="no" id="no" placeholder="번호입력"><br>
    <input type="text" name="name" id="name" placeholder="이름입력"><br>
    <input type="text" name="kor" id="kor" placeholder="국어점수"><br>
    <input type="text" name="eng" id="eng" placeholder="영어점수"><br>
    <input type="text" name="math" id="math" placeholder="수학점수"><br>
    <button type="button" onclick="saveBtn()">저장</button>
    <table>
        <colgroup>
            <col width="10%">
            <col width="15%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="15%">
            <col width="10%">
        </colgroup>
        <thead>
            <tr>
                <th>번호</th>
                <th>이름</th>
                <th>국어</th>
                <th>영어</th>
                <th>수학</th>
                <th>합계</th>
                <th>평균</th>
                <th>등수</th>
                <th>버튼</th>

            </tr>
        </thead>
    <tbody id="tbody">


    </tbody>
    </table>
    <script>
        var aaa = ``;
        for(var i=0;i<students.length;i++){
            aaa+= `
            <tr id="${students[i].no}">
                <td>${students[i].no}</td>
                <td>${students[i].name}</td>
                <td>${students[i].kor}</td>
                <td>${students[i].eng}</td>
                <td>${students[i].math}</td>
                <td>${students[i].total}</td>
                <td>${students[i].avg}</td>
                <td>${students[i].rank}</td>
                <td>
                    <button class="update">수정</button>
                    <button class="delete">삭제</button>
                </td>
            </tr>
            `;



            };
            $("#tbody").html(aaa);
    </script>



</body>
</html>
